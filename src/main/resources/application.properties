# Application Name
spring.application.name=spring-grpc-server

# =============================================================================
# gRPC Server Configuration
# =============================================================================
# Spring gRPC uses these properties to configure the gRPC server

# gRPC server port (default: 9090)
# gRPC typically runs on a different port than HTTP to avoid conflicts
spring.grpc.server.port=9090

# Enable gRPC server reflection
# This allows tools like grpcurl to discover services without proto files
# Essential for development and debugging
spring.grpc.server.reflection.enabled=true

# Enable gRPC health check service
# Provides standardized health checking via grpc.health.v1.Health service
spring.grpc.server.health.enabled=true

# =============================================================================
# Database Configuration (H2 In-Memory Database)
# =============================================================================
# H2 is a lightweight database perfect for development and testing
# Data is stored in memory and lost when application stops

spring.datasource.url=jdbc:h2:mem:tododb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Web UI for database inspection)
# Access at: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
# create-drop: Creates schema on startup, drops on shutdown (good for development)
# update: Updates schema without dropping (for production with caution)
# validate: Only validates schema matches entities (safest for production)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# Spring Boot Actuator - Observability Configuration
# =============================================================================
# Actuator provides production-ready features: health checks, metrics, tracing

# HTTP port for Actuator endpoints (separate from gRPC port)
management.server.port=8081

# Expose actuator endpoints
# health: Application health status
# info: Application information
# metrics: Application metrics (counters, gauges, timers)
# prometheus: Metrics in Prometheus format
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Health endpoint configuration
# show-details: Show detailed health information (components, disk space, etc.)
# show-components: Show status of individual components
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Enable specific health indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true

# =============================================================================
# Metrics and Tracing
# =============================================================================
# Micrometer provides metrics collection and export

# Application metrics tags (added to all metrics)
management.metrics.tags.application=${spring.application.name}

# Enable gRPC metrics
# Spring gRPC automatically records metrics for RPC calls
management.metrics.enable.grpc.server=true

# Tracing configuration (for distributed tracing with Zipkin, Jaeger, etc.)
# Sample rate: 1.0 = 100% (trace all requests), 0.1 = 10%
management.tracing.sampling.probability=1.0

# =============================================================================
# Logging Configuration
# =============================================================================
# Configure log levels for different packages

# Show SQL parameters (helpful for debugging)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# gRPC framework logging
logging.level.io.grpc=INFO
logging.level.org.springframework.grpc=DEBUG

# Application logging
logging.level.com.example.springgrpcserver=DEBUG
